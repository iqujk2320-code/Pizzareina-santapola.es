/* Layout: poster world. One centred column on paper; a mozzarella strand runs in the side margins from the pulled slice to the phone number; olive branches peek in from both edges */
:root{
  color-scheme: light;
  --paper:#FCFCFA;
  --card:#FCFCFA;
  --green:#1F4A33;
  --leaf-1:#1F4A33;
  --leaf-2:#3B6B45;
  --leaf-3:#5E8A5A;
  --red:#A3161A;
  --ink:#1D1F1B;
  --muted:#5A6157;
  --cheese:#F6C445;
  --cheese-light:#FFEDB0;
  --cheese-dark:#D18F1C;
  --wood:#B98A55;
  --display:"Playfair Display", Georgia, "Times New Roman", serif;
  --body:"Fira Sans Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
}
html{overflow-x:clip}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;position:relative;overflow-x:clip}
body.locked{overflow:hidden}
.wrap{max-width:1040px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit}

/* ---------- top controls (inside hero) ---------- */
.hero-top{position:fixed;z-index:45;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;align-items:center}
.hero-top .lang{box-shadow:0 4px 14px rgba(31,74,51,.16)}
.lang{display:inline-flex;border:2px solid var(--green);border-radius:999px;background:var(--card);padding:2px}
.lang button{border:0;background:none;color:var(--green);font-weight:700;font-size:14px;letter-spacing:.06em;padding:0 11px;border-radius:999px;cursor:pointer;min-width:44px;min-height:40px}
.lang button[aria-pressed="true"]{background:var(--green);color:var(--card)}
.lang button:focus-visible,.ctl:focus-visible,.chip:focus-visible,.btn:focus-visible{outline:3px solid var(--cheese-dark);outline-offset:2px}
.ctl{font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;border:2px solid var(--green);background:var(--card);color:var(--green);border-radius:999px;padding:8px 14px;cursor:pointer}
.ctl:hover{background:var(--green);color:var(--card)}

/* ---------- HERO / INTRO ---------- */
html.js-intro .hero-inner{visibility:hidden}
.hero-inner{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2svh,20px);text-align:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{font-family:var(--display);font-weight:900;color:var(--green);font-size:clamp(44px,12vw,120px);line-height:.95;letter-spacing:.01em;margin:0;position:relative;z-index:3}
.logo span{display:inline-block}
.tagline{font-weight:600;text-transform:uppercase;letter-spacing:.26em;font-size:clamp(11px,2.7vw,18px);margin:0;position:relative;z-index:3}
.pizza-wrap{--S:min(62vw,34svh,370px);position:relative;width:var(--S);height:var(--S);margin-block:calc(var(--S)*.16) calc(var(--S)*.12);perspective:2000px;perspective-origin:50% 30%}
.tilt{position:absolute;inset:0;transform-style:preserve-3d;z-index:2}
.board{position:absolute;inset:-7%;border-radius:50%;
  background:
    radial-gradient(circle at 50% 50%,transparent 0 62%,rgba(90,52,20,.25) 63%,transparent 64% 100%),
    repeating-linear-gradient(97deg,rgba(255,255,255,.06) 0 3px,rgba(80,45,15,.07) 3px 7px,rgba(255,255,255,0) 7px 13px),
    radial-gradient(circle at 40% 35%,#D2A46C,#B98A55 60%,#9C6E3F);
  box-shadow:inset 0 0 0 calc(var(--S)*.012) rgba(110,70,30,.55),0 calc(var(--S)*.04) calc(var(--S)*.08) rgba(70,40,12,.28)}
.layer{position:absolute;border-radius:50%}
.dough{inset:0;background:radial-gradient(circle at 42% 36%,#F8E8C8,#EED7A8 55%,#DDBB80);box-shadow:inset 0 0 0 calc(var(--S)*.035) rgba(214,170,105,.55),inset 0 calc(var(--S)*-.02) calc(var(--S)*.05) rgba(150,100,40,.25)}
.sauce{inset:7%;background:radial-gradient(circle at 45% 40%,#D2412A,#B42A1B 62%,#8F1E14);border-radius:48% 52% 51% 49% / 50% 47% 53% 50%}
.melt{inset:8.5%;background:radial-gradient(circle at 45% 40%,#FFF0BF,#FADB86 55%,#F0B94E);border-radius:51% 49% 47% 53% / 49% 52% 48% 51%;opacity:0}
.shreds,.tops{position:absolute;inset:0;transform-style:preserve-3d}
.shred{position:absolute;width:3.4%;height:1%;border-radius:2px;background:linear-gradient(#FFF8DD,#F6DE95);box-shadow:0 .5px 1px rgba(150,110,30,.35)}
.pep{position:absolute;border-radius:50%;background-repeat:no-repeat;box-shadow:0 1px 2px rgba(80,20,0,.3)}
.basil{position:absolute;background-size:100% 100%}
.photo{position:absolute;inset:0;filter:drop-shadow(0 1px 1.2px rgba(60,30,5,.45))}
.slice,.pull,.wedge{position:absolute;inset:0}
.pull{transform-origin:65.5% 76.8%;will-change:transform}
.slice.pulled{z-index:5}
.slice.pulled .pull{filter:drop-shadow(0 calc(var(--lift,0)*12px) calc(var(--lift,0)*10px) rgba(60,30,8,.35))}
.wedge,.pep{background-image:url("img/pizza-flyer.webp")}
.wedge{background-size:100% 100%}
.cuts,.strands{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.cuts{z-index:6}
.cuts line{stroke:rgba(255,248,232,.95);stroke-width:.45;stroke-linecap:round;opacity:0}
.strands{z-index:4}
.glow{position:absolute;inset:-4%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,196,110,.6),rgba(255,160,60,.2) 60%,transparent);opacity:0;pointer-events:none;z-index:7}
.intro-branch{position:absolute;width:calc(var(--S)*.44);height:calc(var(--S)*1.12);top:calc(var(--S)*-.08);z-index:1}
.intro-branch.left{left:calc(var(--S)*-.43)}
.intro-branch.right{right:calc(var(--S)*-.43)}
.intro-branch.right .flip,.side-branch.right .flip{transform:scaleX(-1)}
.flip,.flip svg{width:100%;height:100%;display:block}
.badge{position:absolute;z-index:8;width:max(84px,calc(var(--S)*.32));right:calc(var(--S)*-.16);top:calc(var(--S)*-.12)}
.badge .disc{aspect-ratio:1;border-radius:50%;background:var(--red);color:#FFF8EE;display:grid;place-content:center;text-align:center;box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--red),0 10px 24px rgba(120,10,10,.28);font-family:var(--display);line-height:.95}
.badge .disc small{font-weight:700;font-size:max(12px,calc(var(--S)*.05));letter-spacing:.04em;text-transform:uppercase}
.badge .disc b{font-weight:700;font-size:max(30px,calc(var(--S)*.125))}
.badge .cap{margin:9px auto 0;width:max-content;max-width:160%;background:var(--paper);padding:3px 8px;border-radius:4px;font-family:var(--display);font-weight:700;font-size:max(10px,calc(var(--S)*.033));line-height:1.15;text-transform:uppercase;text-align:center}
.hero-foot{position:relative;z-index:3}
.hero-foot-in{display:flex;flex-direction:column;align-items:center;gap:6px}
.hero-foot .forty{font-family:var(--display);font-size:clamp(20px,4.4vw,32px);color:var(--green);margin:0}
.hero-foot .note{margin:0;font-weight:600;color:var(--red);font-size:clamp(14px,3vw,18px)}
.hint{margin-top:4px;display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.hint i{width:14px;height:22px;border:2px solid var(--muted);border-radius:8px;position:relative}
.hint i::after{content:"";position:absolute;left:50%;top:4px;width:4px;height:6px;margin-left:-2px;border-radius:2px;background:var(--cheese-dark);animation:wheel 1.4s ease-in-out infinite}
@keyframes wheel{0%{transform:translateY(0);opacity:1}100%{transform:translateY(8px);opacity:0}}

/* ---------- CHEESE LAYER ---------- */
#cheese{position:absolute;left:0;top:0;width:100%;pointer-events:none;z-index:1;overflow:visible}
#cShadow{fill:rgba(110,62,10,.16)}
#cBody{fill:url(#cheeseFill);stroke:var(--cheese-dark);stroke-width:1;stroke-linejoin:round}
#cHi{fill:none;stroke:var(--cheese-light);stroke-linecap:round;opacity:.95}
#cTex{fill:none;stroke:var(--cheese-dark);stroke-width:1;opacity:.35}
#cString{fill:none;stroke:#F4C64F;stroke-linecap:round;opacity:.95}
#cheese .blob{fill:url(#cheeseBlob)}
.drip{transform:scaleY(0);transform-box:fill-box;transform-origin:50% 0;transition:transform .9s cubic-bezier(.25,1.5,.45,1)}
.drip.on{transform:scaleY(1)}
.drip path{fill:url(#cheeseFill);stroke:var(--cheese-dark);stroke-width:.8}
.drip ellipse{fill:var(--cheese-light);opacity:.85}

/* ---------- SECTIONS ---------- */
.sec{position:relative;padding-block:clamp(84px,12vw,140px)}
.side-branch{position:absolute;width:clamp(70px,12vw,180px);aspect-ratio:100/260;z-index:0;pointer-events:none}
.side-branch.left{left:calc(clamp(70px,12vw,180px)*-.28);transform-origin:0% 100%}
.side-branch.right{right:calc(clamp(70px,12vw,180px)*-.28);transform-origin:100% 100%}
.side-branch svg{animation:sway 6s ease-in-out infinite;transform-origin:30% 100%}
.side-branch.alt svg{animation-duration:7.5s;animation-delay:-2s}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.z{position:relative;z-index:2}

.offer{text-align:center}
.offer .forty{font-family:var(--display);font-size:clamp(26px,5vw,44px);color:var(--green);margin:0}
.offer .big{font-weight:800;color:var(--red);font-size:clamp(110px,26vw,250px);line-height:.9;margin:6px 0 4px;letter-spacing:-.02em}
.offer .only{font-weight:700;font-size:clamp(26px,5.4vw,46px);line-height:1.1;margin:0;text-wrap:balance}
.offer .sub{margin:12px 0 0;color:var(--muted);font-size:clamp(16px,2.4vw,20px)}
.offer .rule{width:min(420px,70%);height:4px;background:var(--green);margin:22px auto 0;border:0}

.sec-head{text-align:center;margin-bottom:clamp(22px,4vw,40px)}
.sec-head h2{font-family:var(--display);font-weight:900;color:var(--green);font-size:clamp(34px,7vw,62px);margin:0;line-height:1.02;text-wrap:balance}
.sec-head p{margin:10px 0 0;color:var(--muted)}
.sub-head{margin-top:clamp(56px,8vw,90px)}

.chips{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:10px 2px;margin-bottom:22px;background:linear-gradient(var(--paper) 78%,rgba(251,248,241,0));-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--green);background:var(--card);color:var(--green);font-weight:700;font-size:14px;letter-spacing:.03em;text-transform:uppercase;padding:8px 14px;border-radius:999px;text-decoration:none;white-space:nowrap}
.chip:hover{background:var(--green);color:var(--card)}
@media (min-width:900px){.chips{justify-content:center;flex-wrap:wrap}}

.menu-grid{display:grid;grid-template-columns:1fr 1fr;column-gap:clamp(16px,2.4vw,28px);row-gap:clamp(52px,6vw,64px);align-items:start}
.col{display:flex;flex-direction:column;gap:clamp(52px,6vw,64px);min-width:0}
.card{background:var(--card);border:2.5px solid var(--green);padding:20px clamp(16px,2.4vw,26px) 22px;position:relative;z-index:2;min-width:0;scroll-margin-top:70px}
.card h3{margin:0 0 14px;text-align:center;font-weight:700;text-transform:uppercase;letter-spacing:.02em;color:var(--green);font-size:clamp(23px,3.2vw,31px);line-height:1.05}
.card ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
.row{display:flex;align-items:baseline;gap:8px}
.row .n{font-weight:700;text-transform:uppercase;color:var(--green);font-size:18px;letter-spacing:.02em;min-width:0}
.row .dots{flex:1;border-bottom:2px dotted rgba(31,74,51,.3);transform:translateY(-4px);min-width:12px}
.row .p{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.card li p{margin:2px 0 0;color:var(--muted);font-size:15px;line-height:1.35}
.card .tag{font-weight:500;text-transform:none;color:var(--muted);font-size:15px;letter-spacing:0}

/* gallery */
.gal{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:repeat(2,minmax(0,1fr));gap:14px;aspect-ratio:16/8}
.ph{position:relative;z-index:2;border:2.5px dashed rgba(31,74,51,.45);background:repeating-linear-gradient(135deg,#F3EEE2 0 14px,#EEE7D7 14px 28px);display:grid;place-content:center;justify-items:center;gap:8px;text-align:center;color:var(--green);padding:12px;min-width:0;border-radius:3px}
.ph:first-child{grid-row:span 2}
.ph:nth-child(4){grid-column:2 / span 2}
.ph svg{width:38px;height:38px;opacity:.7}
.ph b{font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:15px}
.ph span{font-size:13px;color:var(--muted)}

/* map + contact */
.find{display:grid;grid-template-columns:1.15fr 1fr;gap:clamp(20px,4vw,48px);align-items:center}
.map{position:relative;z-index:2;aspect-ratio:4/3;border:2.5px solid var(--green);overflow:hidden;background:#E9EFE3;border-radius:3px}
.map svg{width:100%;height:100%;display:block}
.map .lbl{position:absolute;left:10px;bottom:10px;background:var(--card);border:1.5px solid var(--green);color:var(--green);font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:4px 8px;border-radius:3px}
.pin{transform-box:fill-box;transform-origin:50% 100%;animation:pin 2.4s ease-in-out infinite}
@keyframes pin{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.info{position:relative;z-index:2}
.info .delivery{display:inline-block;background:var(--card);border:2.5px solid var(--green);padding:12px 18px;margin:0 0 22px}
.info .delivery b{color:var(--green);text-transform:uppercase;letter-spacing:.03em}
.info .addr{font-weight:700;font-size:clamp(20px,3vw,28px);margin:0;line-height:1.2}
.info .phone{display:inline-block;margin-top:12px;font-weight:800;font-size:clamp(40px,7vw,64px);color:var(--green);text-decoration:none;font-variant-numeric:tabular-nums;line-height:1;cursor:pointer}
.info .small{margin:12px 0 18px;color:var(--muted);font-size:15px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--green);border-radius:999px;padding:11px 18px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:14px;text-decoration:none;color:var(--green);background:var(--card)}
.btn.solid{background:var(--green);color:var(--card)}
footer{text-align:center;padding-block:28px 40px;color:var(--muted);font-size:13px;letter-spacing:.08em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:14px}

/* mobile action bar */
.mbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:none;gap:8px;padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:rgba(252,252,250,.97);border-top:1.5px solid rgba(31,74,51,.2);transform:translateY(110%);transition:transform .4s ease}
.mbar.show{transform:none}
.mbar a{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:5px;min-height:48px;padding:0 6px;border-radius:12px;border:2px solid var(--green);color:var(--green);background:var(--card);font-weight:700;font-size:13px;letter-spacing:.01em;white-space:nowrap;text-transform:uppercase;text-decoration:none}
.mbar a.solid{background:var(--green);color:var(--card)}
.mbar svg{width:17px;height:17px;flex:none}

@media (max-width:760px){
  .menu-grid,.find{grid-template-columns:1fr}
  .find{text-align:center}.btns{justify-content:center}
  .side-branch{opacity:.55}
  .badge{right:calc(var(--S)*-.1);top:calc(var(--S)*-.16)}
  .intro-branch{width:calc(var(--S)*.36)}
  .intro-branch.left{left:calc(var(--S)*-.3)}
  .intro-branch.right{right:calc(var(--S)*-.3)}
  .mbar{display:flex}
  body{padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}
  .gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;aspect-ratio:auto;gap:12px;padding-bottom:6px;scrollbar-width:none}
  .gal::-webkit-scrollbar{display:none}
  .ph{flex:0 0 78%;aspect-ratio:4/3;scroll-snap-align:center}
  .row .n{font-size:17px}
  .hero{padding-block:58px 22px}
}
@media (prefers-reduced-motion: reduce){
  .side-branch svg,.hint i::after,.pin{animation:none}
  .drip,.mbar{transition:none}
}
@property --bz{syntax:'<length>';inherits:false;initial-value:0px}
@keyframes bob{0%,100%{--bz:-6px}50%{--bz:7px}}
.l3 .layer{box-shadow:0 calc(var(--S)*.02) calc(var(--S)*.05) rgba(60,30,8,.18)}
.l3 .dough{box-shadow:inset 0 0 0 calc(var(--S)*.035) rgba(214,170,105,.55),inset 0 calc(var(--S)*-.02) calc(var(--S)*.05) rgba(150,100,40,.25)}
.sauce{background:radial-gradient(circle at 30% 30%,rgba(255,140,110,.35),transparent 18%),radial-gradient(circle at 66% 58%,rgba(255,140,110,.25),transparent 14%),radial-gradient(circle at 45% 40%,#D2412A,#B42A1B 62%,#8F1E14)!important}
#melt{opacity:.25}
.hero-foot{display:grid}
.hero-foot>*{grid-area:1/1}
.endtext .forty{font-family:var(--display);font-size:clamp(20px,4.4vw,32px);color:var(--green);margin:0}
.endtext .note{margin:0;font-weight:600;color:var(--red);font-size:clamp(14px,3vw,18px)}
.cdrip{position:absolute;left:0;top:100%;margin-top:-2px;overflow:visible;pointer-events:none;z-index:1}
.cdrip .rim,.cdrip .cd path{fill:url(#cheeseFill);stroke:var(--cheese-dark);stroke-width:.9}
.cdrip .cd ellipse{fill:var(--cheese-light);opacity:.85}
.cdrip .ooze{transform-box:fill-box;transform-origin:50% 0;animation:ooze 3.6s ease-in-out infinite}
@keyframes ooze{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.09)}}

/* ---------- INFINITE CAROUSELS (swipe only, no autoplay) ----------
   The items are repeated 3 times; when the visitor reaches the first or last copy
   we silently jump by one full set, so there is never an end. */
(function(){
  var cars=[];
  function Car(sc){
    var me=this;this.sc=sc;this.setW=0;this.t=null;
    sc.addEventListener('scroll',function(){clearTimeout(me.t);me.t=setTimeout(function(){me.fix()},140)},{passive:true});
    if('onscrollend' in window)sc.addEventListener('scrollend',function(){me.fix()});
    var box=sc.parentNode;
    $('.prev',box).addEventListener('click',function(){me.step(-1)});
    $('.next',box).addEventListener('click',function(){me.step(1)});
    // mouse drag on desktop
    var d=null;
    sc.addEventListener('pointerdown',function(e){if(e.pointerType!=='mouse')return;d={x:e.clientX,l:sc.scrollLeft,m:false}});
    addEventListener('pointermove',function(e){if(!d)return;var dx=e.clientX-d.x;if(!d.m&&Math.abs(dx)>4){d.m=true;sc.classList.add('dragging')}if(d.m)sc.scrollLeft=d.l-dx});
    addEventListener('pointerup',function(){if(!d)return;var moved=d.m;d=null;if(moved){sc.classList.remove('dragging');me.snap()}});
    this.measure();
  }
  Car.prototype.itemW=function(){var a=this.sc.children[0],b=this.sc.children[1];return b?b.offsetLeft-a.offsetLeft:a.offsetWidth};
  Car.prototype.measure=function(){var n=this.sc.children.length/3;if(!n)return;var ratio=this.setW?(this.sc.scrollLeft/this.setW):1;
    this.setW=this.sc.children[n].offsetLeft-this.sc.children[0].offsetLeft;var sn=this.sc.style.scrollSnapType;this.sc.style.scrollSnapType='none';this.sc.scrollLeft=Math.round(ratio*this.setW);this.sc.style.scrollSnapType=sn;this.fix()};
  Car.prototype.fix=function(){var sc=this.sc,w=this.setW;if(!w)return;var l=sc.scrollLeft;
    if(l<w*.5||l>w*1.5){var sn=sc.style.scrollSnapType;sc.style.scrollSnapType='none';sc.scrollLeft=l<w*.5?l+w:l-w;sc.style.scrollSnapType=sn}};
  Car.prototype.step=function(dir){this.fix();this.sc.scrollBy({left:dir*this.itemW(),behavior:reduce?'auto':'smooth'})};
  Car.prototype.snap=function(){var w=this.itemW();this.sc.scrollTo({left:Math.round(this.sc.scrollLeft/w)*w,behavior:'smooth'})};
  cars.push(new Car($('#gal')),new Car($('#pgal')));
  window.__carReset=function(){cars.forEach(function(c){c.measure()})};
  addEventListener('resize',window.__carReset);addEventListener('load',window.__carReset);
})();
